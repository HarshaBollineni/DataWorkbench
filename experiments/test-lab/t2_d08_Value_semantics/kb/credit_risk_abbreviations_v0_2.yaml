metadata:
  name: Credit Risk Abbreviation and Terminology Dictionary
  version: '0.2'
  purpose: Expand common abbreviations and naming conventions in credit-risk dataset feature names before deterministic
    or NLP feature matching.
  scope: Generic banking and credit risk, consumer, mortgage, small business, commercial, CRE, financial statements,
    macroeconomic variables, time windows, transformations, and aggregations.
  usage_note: Apply known multi-token/domain acronyms first, then token-level abbreviations. Use token boundaries and
    do not perform unsafe substring replacement. Ambiguous abbreviations require contextual resolution.
  change_note: CLTV changed from a deterministic acronym expansion to an ambiguous abbreviation with candidate meanings
    'current loan to value' and 'combined loan to value'.
