ambiguous_abbreviations:
  cr:
    candidates:
    - credit
    - current ratio
    note: Do not automatically expand without supporting feature description or surrounding tokens.
  rr:
    candidates:
    - risk rating
    - recovery rate
    note: Meaning depends strongly on PD versus LGD context and institutional naming.
  pd:
    candidates:
    - probability of default
    - past due
    note: Use model context and surrounding tokens.
  ir:
    candidates:
    - interest rate
    - internal rating
    note: Use feature description and surrounding tokens.
  cf:
    candidates:
    - cash flow
    - conversion factor
    note: Cash flow is common in financial statement variables; conversion factor is common in EAD contexts.
  ca:
    candidates:
    - current assets
    - capital adequacy
    note: Requires context.
  fi:
    candidates:
    - financial institution
    - fixed income
    note: Requires context.
  cap:
    candidates:
    - capital
    - capitalization
    note: Do not infer capitalization rate from 'cap' alone.
  co:
    candidates:
    - charge off
    - company
    note: Consumer credit context may imply charge-off; otherwise requires context.
  rtg:
    candidates:
    - rating
    - rate
    note: Prefer feature description or adjacent tokens.
  cltv:
    candidates:
    - current loan to value
    - combined loan to value
    note: CLTV is institution- and dataset-dependent. It may mean current loan-to-value or combined loan-to-value (including
      multiple liens). Do not automatically expand CLTV without using the feature description, data dictionary, surrounding
      tokens, or institution-specific terminology.
parsing_guidance:
- Normalize case and separators before expansion.
- Attempt common compound-term and domain-acronym expansion before token-level abbreviation expansion.
- Apply replacements only on complete normalized tokens or recognized compound terms; never use unrestricted substring
  replacement.
- Preserve numeric tokens because they often represent observation windows, for example 12M or 24M.
- Interpret compact time-window tokens such as 12M, 24M, 3Q, or 5Y as durations when pattern recognition is unambiguous.
- Do not automatically resolve entries listed under ambiguous_abbreviations.
- Use the feature description and surrounding tokens to resolve ambiguous abbreviations.
- The terminology dictionary improves candidate generation; it does not determine expected directionality.
