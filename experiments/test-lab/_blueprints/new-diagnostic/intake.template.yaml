  new_provider_call_trigger: "explicit_request_for_feature_without_reusable_inference"
  separate_new_call_and_reuse_counts: true

governance:
  tenant_boundary: "{{REQUIRED_BOUNDARY}}"
  authentication_boundary: "{{REQUIRED_BOUNDARY}}"
  sensitive_data_policy: "{{POLICY}}"
  artifact_retention: "{{POLICY}}"
  issue_creation_policy: "human_confirmation_required"
  rca_handoff_policy: "{{POLICY}}"

acceptance:
  golden_fixture_classes:
    - positive
    - negative
    - boundary
    - ambiguous
  invariants: []
  regression_dependencies: []
  production_readiness_owner: "{{OWNER}}"
