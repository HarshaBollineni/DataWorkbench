user_decision:
  primary_question: "{{ONE_PLAIN_LANGUAGE_QUESTION}}"
  decision_type: "{{verdict|classification|comparison|recommendation|evidence_only}}"
  intended_users: []
  decisions_enabled: []
  non_goals: []

scope:
  snapshot_cardinality: "{{one|two|many}}"
  table_cardinality: "{{one|many}}"
  field_selection: "{{all|user_selected|role_selected}}"
  population_boundary: "{{DESCRIPTION}}"
  general_context_supported: false
  optional_context_labels: []
  context_effect_on_rules: "{{none|explanation_only|explicit_routing}}"
  partial_coverage_outcome: "{{UNSCOPED_OR_EQUIVALENT}}"

inputs:
  required_semantic_roles: []
  optional_semantic_roles: []
  required_declarations: []
  optional_declarations: []
  upstream_artifact_types: []
  knowledge_packages: []

outputs:
  result_kind: "{{RESULT_KIND}}"
  metrics: []
  tags_or_classifications: []
  candidate_findings: []
  downloadable_reports: []
  aar_artifacts: []
  downstream_consumers: []

method:
  deterministic_boundary: "{{WHAT_IS_DETERMINISTIC}}"
  rule_identity_strategy: "{{HOW_RULE_IDS_REMAIN_STABLE}}"
  missing_prerequisite_behavior: "{{FAIL_CLOSED_BEHAVIOR}}"
  precedence_or_tie_behavior: "{{BEHAVIOR_OR_NOT_APPLICABLE}}"
